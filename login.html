<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChopHouse | Login</title>
    <link rel="stylesheet" href="login.css?v=20260422-2" />
  </head>
  <body>
    <div class="login-shell">
      <header class="login-header">
        <a class="brand" href="index.html" aria-label="Back to ChopHouse home">
          <img class="brand__logo" src="assets/chophouse-logo.jpg" alt="ChopHouse logo" />
          <div>
            <p class="brand__name">CHOP HOUSE</p>
            <p class="brand__tag">RESTO BAR X CAFE</p>
          </div>
        </a>
        <a class="back-link" href="index.html">Back to Website</a>
      </header>

      <main class="login-main">
        <section class="login-card" aria-labelledby="login-title">
          <div class="login-card__header">
            <p class="login-card__eyebrow">Account Login</p>
            <h2 id="login-title">Welcome back</h2>
            <p class="login-card__intro">Enter your account details to continue.</p>
          </div>

          <form class="login-form" id="login-form">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@chophouse.com" required />

            <label for="password">Password</label>
            <div class="password-row">
              <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
              />
              <button class="password-toggle" id="password-toggle" type="button">Show</button>
            </div>

            <div class="login-options">
              <label class="remember-line" for="remember-me">
                <input type="checkbox" id="remember-me" />
                <span>Remember me</span>
              </label>
              <button class="text-link text-link--button" id="forgot-password-trigger" type="button">
                Forgot password?
              </button>
            </div>

            <button class="button" type="submit">Sign In</button>
            <p class="login-message" id="login-message" aria-live="polite"></p>
          </form>
        </section>
      </main>
    </div>

    <div class="modal-backdrop" id="forgot-password-modal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="forgot-password-title">
        <div class="modal-card__header">
          <div>
            <p class="login-card__eyebrow">Password Recovery</p>
            <h2 id="forgot-password-title">Reset your password</h2>
          </div>
          <button class="modal-close" id="close-forgot-password-modal" type="button" aria-label="Close forgot password modal">
            X
          </button>
        </div>

        <div class="forgot-password-flow">
          <form class="login-form login-form--compact" id="forgot-password-request-form">
            <label for="forgot-password-email">Account Email</label>
            <input
              type="email"
              id="forgot-password-email"
              placeholder="you@chophouse.com"
              required
            />

            <button class="button" type="submit">Send Reset Code</button>
          </form>

          <div class="reset-code-panel" id="reset-code-panel" hidden>
            <p class="reset-code-panel__label">Reset code</p>
            <strong id="reset-code-value">------</strong>
            <small id="reset-code-expiry">This code expires soon.</small>
          </div>

          <form class="login-form login-form--compact" id="forgot-password-reset-form">
            <label for="forgot-password-code">Reset Code</label>
            <input
              type="text"
              id="forgot-password-code"
              inputmode="numeric"
              maxlength="6"
              placeholder="Enter the 6-digit code"
              required
            />

            <label for="forgot-password-new-password">New Password</label>
            <input
              type="password"
              id="forgot-password-new-password"
              placeholder="Enter a new password"
              minlength="6"
              required
            />

            <label for="forgot-password-confirm-password">Confirm New Password</label>
            <input
              type="password"
              id="forgot-password-confirm-password"
              placeholder="Re-enter the new password"
              minlength="6"
              required
            />

            <button class="button" type="submit">Update Password</button>
          </form>
        </div>

        <p class="login-message login-message--modal" id="forgot-password-message" aria-live="polite"></p>

        <div class="modal-card__footer">
          <button class="button button--ghost" id="cancel-forgot-password-modal" type="button">
            Close
          </button>
        </div>
      </div>
    </div>

    <script src="api.js?v=20260422-2"></script>
    <script src="login.js?v=20260422-2"></script>
  </body>
</html>
