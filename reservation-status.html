<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChopHouse | Reservation Status</title>
    <link rel="stylesheet" href="styles.css?v=20260828-ops-export" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="index.html#home" aria-label="ChopHouse home">
          <img class="brand__logo" src="assets/chophouse-logo.jpg" alt="ChopHouse logo" />
          <div>
            <p class="brand__name">CHOP HOUSE</p>
            <p class="brand__tag">RESTO BAR X CAFE</p>
          </div>
        </a>
        <nav class="site-nav">
          <a href="index.html#home">Home</a>
          <a href="index.html#reservation">Reservation</a>
          <a href="reservation-status.html">Check Status</a>
          <a class="site-nav__login" href="login.html">Login</a>
        </nav>
      </header>

      <main>
        <section class="section-card status-lookup-section">
          <div class="section-copy">
            <span class="section-pill section-pill--sensor">Reservation Tracker</span>
            <h1>Check your reservation status</h1>
            <p>
              Enter the email used in your reservation and either your reservation ID or GCash
              reference number.
            </p>
          </div>

          <form class="reservation-form status-lookup-form" id="reservation-status-form">
            <label>
              Email:
              <input type="email" id="status-email" placeholder="juan@example.com" required />
            </label>
            <label>
              Reservation ID:
              <input type="number" id="status-reservation-id" min="1" placeholder="12" />
            </label>
            <label>
              GCash Reference Number:
              <input type="text" id="status-reference" placeholder="Optional if ID is entered" />
            </label>
            <button class="button button--primary reservation-form__button" type="submit">
              Check Status
            </button>
            <p class="reservation-form__message" id="reservation-status-message"></p>
          </form>

          <div class="status-result" id="reservation-status-result" hidden></div>
        </section>
      </main>

      <footer class="site-footer">
        <p>&copy; 2026 Chop House Resto Bar. All rights reserved.</p>
      </footer>
    </div>

    <script src="api.js?v=20260828-ops-export"></script>
    <script src="reservation-status.js?v=20260828-ops-export"></script>
  </body>
</html>
